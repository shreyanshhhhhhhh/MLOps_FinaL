# CI runs on every pull request and every push.
# Jobs are ordered. A failure stops the rest. A newer push cancels the older run.
name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache writes for pip and, in the build job, Buildx
  actions: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        # actions/setup-python v7.1.0. 3.12 matches requirements.txt.
        # numpy 2.5.4 does not publish a 3.11 wheel. The image is 3.11
        # with numpy 2.4.6; the tests run on the training pins.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src app tests

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml \
            --cov=app --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload pytest report and coverage
        # actions/upload-artifact v7.0.2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-report
          path: reports/
          if-no-files-found: error

  pipeline-check:
    name: pipeline-check
    runs-on: ubuntu-latest
    needs: test
    # OIDC for the preferred role path. Access keys are the lab fallback.
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      DVC_NO_ANALYTICS: "1"
      DVC_REMOTE: s3
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install DVC
        # The check only needs the client that can pull the lock. Pin matches requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]==3.67.1"

      - name: Choose AWS credentials
        id: auth
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          # Do not print KEY or ROLE. GitHub masks registered secrets; this
          # step only records which method is configured.
          if [ -n "$ROLE" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "Add AWS_ROLE_ARN, or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY." >&2
            exit 1
          fi

      - name: Assume the CI role
        if: steps.auth.outputs.mode == 'oidc'
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Pull and compare the lock
        # Key mode uses the env vars above. OIDC mode replaces them in this step.
        # The script fails unless `dvc status` and `dvc repro --dry` are clean.
        run: bash scripts/ci_pipeline_check.sh

  build:
    name: build
    runs-on: ubuntu-latest
    needs: pipeline-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build the image
        # docker/build-push-action v7.4.0. CI does not push.
        # The Dockerfile copies no model binary. CD is what publishes.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: false
          tags: priceoptima:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
