# CD runs after CI succeeds on a push to main, or on a v* tag.
# workflow_run is how this file waits for CI. GitHub reads this file from
# the default branch, so the first release happens after this file is on main.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Pull-request CI also completes a workflow_run. Only a push of main or a version tag releases.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      image: ${{ steps.tags.outputs.image }}
      short: ${{ steps.tags.outputs.short }}
    steps:
      - name: Checkout the commit CI tested
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu
          sha="${{ github.event.workflow_run.head_sha }}"
          short="$(git rev-parse --short=7 "$sha")"
          image="${USERNAME}/priceoptima"
          git fetch --tags --force origin
          {
            echo "image=${image}"
            echo "short=${short}"
            echo "tags<<EOF"
            echo "${image}:${short}"
            echo "${image}:latest"
            git tag --points-at "$sha" | while read -r tag; do
              case "$tag" in
                v*) echo "${image}:${tag}" ;;
              esac
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build the image for the smoke test
        # docker/build-push-action v7.4.0. load keeps it in the local daemon.
        # Nothing is pushed until the smoke test and the critical scan pass.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: priceoptima:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test before publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -eu
          # Credentials are passed as env vars. This step does not print them.
          docker rm -f priceoptima-smoke >/dev/null 2>&1 || true
          docker run -d --name priceoptima-smoke -p 8000:8000 \
            -e DVC_REMOTE=s3 \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION \
            -e MODEL_AUTOLOAD=1 \
            -e "GIT_REPO_URL=https://github.com/${{ github.repository }}.git" \
            priceoptima:ci
          bash scripts/smoke_test.sh

      - name: Remove the smoke container
        if: always()
        run: docker rm -f priceoptima-smoke >/dev/null 2>&1 || true

      - name: Trivy critical
        # aquasecurity/trivy-action v0.36.0. Critical findings fail the job.
        # High findings are reported in the next step and do not fail it.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: priceoptima:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

      - name: Trivy high report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: priceoptima:ci
          format: table
          severity: HIGH
          exit-code: "0"
          output: trivy-high.txt

      - name: Upload the high-severity report
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-high
          path: trivy-high.txt
          if-no-files-found: warn

      - name: Login to Docker Hub
        # docker/login-action v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ECR alternative. Leave this commented until the OIDC role exists.
      # The role trust policy must allow this repo's GitHub OIDC provider.
      # - name: Login to ECR
      #   uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      # - name: Login to the ECR registry
      #   uses: aws-actions/amazon-ecr-login@...  # pin the SHA the same way
      #   id: ecr
      # Then tag the image ${{ steps.ecr.outputs.registry }}/priceoptima
      # instead of ${{ secrets.DOCKERHUB_USERNAME }}/priceoptima.
      # Do not pass long-lived AWS keys into the EC2 container. ECR pull on
      # the instance uses the same instance role, with ecr:GetAuthorizationToken
      # and ecr:BatchGetImage added. Serving still reads the model from S3.

      - name: Push the tagged image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Deploy on EC2
        env:
          IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.short }}
        # appleboy/ssh-action v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 20m
          envs: IMAGE
          script: |
            set -eu
            cd /opt/priceoptima/src
            git fetch --tags origin
            git checkout --force "${{ github.event.workflow_run.head_sha }}"
            IMAGE="$IMAGE" bash scripts/deploy.sh "$IMAGE"

      - name: Verify the public endpoint
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS "http://${HOST}:8000/ready" >/dev/null \
              && curl -fsS "http://${HOST}:8000/model-info" -o /tmp/model-info.json; then
              python3 -c 'import json; info=json.load(open("/tmp/model-info.json")); assert info.get("model_name"); print(info["model_name"], info.get("model_version"))'
              exit 0
            fi
            sleep 5
          done
          echo "public /ready or /model-info did not succeed within 120s" >&2
          exit 1

      - name: Roll back if the public check failed
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -eu
            prev="$(sed -n 's/^image=//p' /opt/priceoptima/previous.env | head -1)"
            test -n "$prev"
            bash /opt/priceoptima/src/scripts/deploy.sh "$prev"
