# Linear chain so `dvc dag` reads preprocess -> features -> train -> evaluate -> select_best.
# MLflow's ./mlruns directory is a local side effect of train, not a DVC output.
# The promoted model, the fitted preprocessor, and model_meta.json are the registry artifacts.
stages:
  preprocess:
    cmd: python -m src.preprocess
    deps:
      - src/preprocess.py
      - src/config.py
      - src/provenance.py
      - data/raw/retail_price.csv
    params:
      - seed
      - split
      - preprocess
      - paths.raw_csv
      - paths.processed_dir
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/preprocess_meta.json

  features:
    cmd: python -m src.features
    deps:
      - src/features.py
      - src/config.py
      - src/provenance.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - features
      - paths.processed_dir
      - paths.models_dir
    outs:
      - data/processed/train_features.csv
      - data/processed/test_features.csv
      - models/preprocessor.joblib

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/config.py
      - src/provenance.py
      - src/scoring.py
      - data/processed/train_features.csv
      - data/processed/test_features.csv
      - models/preprocessor.joblib
    params:
      - seed
      - models
      - tracking
      - paths
      - features.target
    outs:
      - metrics/train_runs.json
      - metrics/eval_bundle.joblib

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/config.py
      - src/provenance.py
      - src/scoring.py
      - metrics/train_runs.json
      - metrics/eval_bundle.joblib
    params:
      - tracking
      - paths
    metrics:
      - metrics/metrics.json:
          cache: false
    outs:
      - metrics/pred_vs_actual.png
      - metrics/residuals.png

  select_best:
    cmd: python -m src.select_best
    deps:
      - src/select_best.py
      - src/config.py
      - src/provenance.py
      - metrics/metrics.json
    params:
      - tracking
      - paths
    outs:
      - models/model.pkl
      - models/model_meta.json
